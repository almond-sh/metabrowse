name: CI
on:
  push:
    branches:
      - master
      - main
  pull_request:
jobs:
  compile:
    name: Compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: true
      - uses: coursier/cache-action@v6
      - run: ./mill -k __.compile # ensuring metabrowse compiles for all Scala versions

  unit:
    name: Tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        scala: [2.12.20, 2.13.16]
        os: [ubuntu-latest]
        java: [11, 21]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: true
      - uses: coursier/cache-action@v6
      - run: ./mill -k '{tests,js}[${{ matrix.scala }}].test'
        env:
          METABROWSE_TEST_JVM: "temurin:${{ matrix.java }}"
